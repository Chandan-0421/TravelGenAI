<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Premium Itinerary | TravelGenieAi</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Base & Theme Colors */
        :root {
            --green-dark: #113534; --green-mid: #174F27; 
            --brand-red: #E81C5C; --yellow: #FFE093;
            --text-dark: #1A1A1A; --text-muted: #4a5568;
        }
        
        /* 🌟 Fixed Background for Glassmorphism 🌟 */
        body { 
            font-family: 'DM Sans', sans-serif; 
            margin: 0; padding: 0; 
            background: linear-gradient(rgba(17, 53, 52, 0.75), rgba(17, 53, 52, 0.85)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            overflow-x: hidden;
        }
        
        /* Navbar (Frosted Glass) */
        nav { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: #fff; text-decoration: none; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        /* Loader */
        #loader { text-align: center; padding: 100px 20px; color: white; }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--yellow); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 20px; }
        
        /* Header Info */
        .header-info { text-align: center; color: white; margin-bottom: 40px; }
        .header-info h1 { font-family: 'Plus Jakarta Sans'; font-size: 42px; color: var(--yellow); margin-bottom: 10px; }
        .header-info p { font-size: 18px; opacity: 0.9; }

        /* -------------------------------------------
           🔥 GLASSMORPHISM CARDS (Day-wise) 🔥
           ------------------------------------------- */
        .glass-card {
            background: rgba(255, 255, 255, 0.92); /* White translucent */
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            
            /* Framer Motion mimic (Cubic Bezier for buttery smooth spring) */
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            animation: springUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
        }

        /* Staggered Animations (Har card thode delay ke baad aayega) */
        .glass-card:nth-child(1) { animation-delay: 0.1s; }
        .glass-card:nth-child(2) { animation-delay: 0.3s; }
        .glass-card:nth-child(3) { animation-delay: 0.5s; }
        .glass-card:nth-child(4) { animation-delay: 0.7s; }
        .glass-card:nth-child(5) { animation-delay: 0.9s; }
        .glass-card:nth-child(6) { animation-delay: 1.1s; }

        @keyframes springUp {
            to { opacity: 1; transform: translateY(0) scale(1); }
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Clean Markdown Rendering inside Cards */
        .glass-card h2 { color: var(--green-mid); font-family: 'Plus Jakarta Sans'; font-size: 26px; border-bottom: 2px dashed rgba(23,79,39,0.2); padding-bottom: 12px; margin-top: 0; margin-bottom: 20px;}
        .glass-card h3 { color: var(--brand-red); font-size: 20px; margin: 24px 0 12px; }
        .glass-card p { line-height: 1.8; font-size: 16px; color: var(--text-muted); margin-bottom: 16px; }
        .glass-card ul { padding-left: 20px; margin-bottom: 20px; }
        .glass-card li { margin-bottom: 12px; line-height: 1.7; color: var(--text-dark); font-size: 16px;}
        .glass-card strong { color: var(--green-dark); font-weight: 700; }
        
        /* Beautiful Highlight for Local Secrets */
        .glass-card p:has(strong) { background: rgba(255,224,147,0.15); padding: 12px 16px; border-radius: 8px; border-left: 4px solid var(--yellow); }

        /* Action Buttons */
        .btn-print { background: var(--yellow); color: var(--green-dark); padding: 16px 36px; border: none; border-radius: 30px; font-weight: 800; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,224,147,0.3); display: block; margin: 40px auto; }
        .btn-print:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 25px rgba(255,224,147,0.5); }
        .nav-btn { background: rgba(255,255,255,0.2); color: white; padding: 10px 24px; border-radius: 20px; font-weight: 600; text-decoration: none; transition: 0.2s;}
        .nav-btn:hover { background: rgba(255,255,255,0.3); }

        /* Mobile Layout */
        @media (max-width: 768px) {
            nav { padding: 16px 20px; }
            .logo { font-size: 18px; }
            .header-info h1 { font-size: 32px; }
            .glass-card { padding: 24px 20px; border-radius: 16px;}
            .btn-print { width: 100%; }
        }

        /* Print Settings (Saves as normal PDF, hides glassmorphism) */
        @media print {
            body { background: white; color: black; }
            nav, .btn-print, #loader { display: none !important; }
            .header-info { color: black; }
            .header-info h1 { color: var(--green-mid); }
            .glass-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; margin-bottom: 20px; }
            .glass-card p:has(strong) { background: none; border-left: 2px solid black; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index2.html" class="logo">⛺ TravelGenie<span style="color:var(--brand-red)">Ai</span></a>
    <a href="index2.html" class="nav-btn">⬅ Back to Search</a>
</nav>

<div class="container">
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="font-family: 'Plus Jakarta Sans';">Crafting your magical journey...</h2>
        <p>Analyzing routes, local food, and stays.</p>
    </div>

    <div id="result-box" style="display: none;">
        <div class="header-info animate-fade">
            <h1 id="dest-title">Adventure Awaits</h1>
            <p id="dest-sub">Generated by TravelGenieAi</p>
        </div>
        
        <div id="itinerary-cards-container"></div>
        
        <button class="btn-print" onclick="window.print()">📥 Download Full Itinerary (PDF)</button>
    </div>
</div>

<script>
    window.onload = async function() {
        const rawData = localStorage.getItem('travelGenieRequest');
        if(!rawData) {
            alert("No travel data found. Redirecting to home.");
            window.location.href = 'index2.html';
            return;
        }

        const llmData = JSON.parse(rawData);
        
        document.getElementById('dest-title').innerText = `Trip to ${llmData.destination.split(',')[0]}`;
        document.getElementById('dest-sub').innerText = `📅 ${llmData.timing}  |  👥 ${llmData.guests.adult + llmData.guests.child} Guests  |  💰 ${llmData.budget_limit}`;

        try {
            const response = await fetch('http://localhost:5000/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(llmData)
            });

            const data = await response.json();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';

            if (data.success && data.data) {
                // 1. Markdown ko HTML mein convert karo
                const rawHTML = marked.parse(data.data);
                
                // 2. Ek temporary hidden div banao parsing ke liye
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawHTML;

                // 3. 💥 THE MAGIC: H2 tags ko dhoondh kar har ek ko apne "Glass Card" mein daalna 💥
                const container = document.getElementById('itinerary-cards-container');
                let currentCard = null;

                Array.from(tempDiv.children).forEach(el => {
                    // Agar H2 hai (like "Day 1:", "Budget Breakdown"), naya card banao
                    if (el.tagName === 'H2' || el.tagName === 'H1') {
                        currentCard = document.createElement('div');
                        currentCard.className = 'glass-card';
                        container.appendChild(currentCard);
                    }
                    
                    // Element ko card mein add karo
                    if (currentCard) {
                        currentCard.appendChild(el.cloneNode(true));
                    } else {
                        // Agar H2 se pehle kuch intro text hai, toh ek starting intro card bana do
                        let introCard = document.createElement('div');
                        introCard.className = 'glass-card';
                        container.appendChild(introCard);
                        currentCard = introCard;
                        currentCard.appendChild(el.cloneNode(true));
                    }
                });

            } else {
                document.getElementById('itinerary-cards-container').innerHTML = `
                    <div class="glass-card"><h2 style="color:red;">Oops! Something went wrong.</h2><p>Please try again.</p></div>
                `;
            }

        } catch (error) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('itinerary-cards-container').innerHTML = `
                <div class="glass-card"><h2 style="color:red;">Connection Error</h2><p>Failed to connect to the backend server. Is it running?</p></div>
            `;
        }
    };
</script>

</body>
</html>
